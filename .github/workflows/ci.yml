name: Validate BranchLab

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      # Separate from the deployment updater's browser tests on port 5175.
      BRANCHLAB_E2E_PORT: '5177'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - name: Validate the version and user changelog
        env:
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event.before || 'origin/dev' }}
        run: |
          if [[ -n "$CHANGELOG_BASE" && "$CHANGELOG_BASE" != '0000000000000000000000000000000000000000' ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'push' && ( "$GITHUB_REF" == 'refs/heads/dev' || "$GITHUB_REF" == 'refs/heads/main' ) ]]; then
              changelog_base="$CHANGELOG_BASE"
            else
              changelog_base="$(git merge-base HEAD "$CHANGELOG_BASE")"
            fi
            npm run changelog:check -- --base "$changelog_base"
          else
            npm run changelog:check
          fi
      - run: npm run check
      # System dependencies are installed on the host, outside the unprivileged job.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Validate Cloudflare static hosting configuration
        run: npm run hosting:check
      # Workers Builds is the only publisher. This job never authenticates to Cloudflare.
