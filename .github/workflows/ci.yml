name: Validate and publish BranchLab

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publier après validation (main ou dev uniquement)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    # Evaluated before assigning a hosted runner, including while the repo is private.
    if: >-
      ${{ github.repository == 'sinikebe/branchlab' &&
          github.event.repository.private == false &&
          github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: branchlab-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      BRANCHLAB_E2E_PORT: '5177'
      WRANGLER_SEND_METRICS: 'false'
      WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKERS_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check a manual publication request
        run: node scripts/actions-deploy.js request
      - name: Use the pinned npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - name: Validate the version and user changelog
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$CHANGELOG_BASE" && "$CHANGELOG_BASE" != '0000000000000000000000000000000000000000' ]]; then
            npm run changelog:check -- --base "$CHANGELOG_BASE"
          else
            npm run changelog:check
          fi
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Validate Cloudflare packaging without publishing
        run: npm run hosting:check

  publish:
    needs: validate
    if: >-
      ${{ github.repository == 'sinikebe/branchlab' &&
          github.event.repository.private == false &&
          github.event.repository.visibility == 'public' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: branchlab-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      WORKERS_CI: '1'
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      WORKERS_CI_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Confirm the source is still current
        id: source
        run: node scripts/actions-deploy.js source
      - name: Check the required account and secrets
        if: steps.source.outputs.publish == 'true'
        id: credentials
        run: node scripts/actions-deploy.js credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Rebuild the validated immutable revision
        if: steps.credentials.outputs.ready == 'true'
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci
          npm run build
      - name: Recheck the build and branch head immediately before publication
        if: steps.credentials.outputs.ready == 'true'
        id: fresh
        run: node scripts/actions-deploy.js preflight
      - name: Publish main to the existing production Worker
        if: steps.fresh.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish dev to its stable Preview
        if: steps.fresh.outputs.publish == 'true' && github.ref == 'refs/heads/dev'
        run: npx --no-install wrangler preview --name dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published revision over HTTPS
        if: steps.fresh.outputs.publish == 'true'
        run: node scripts/actions-deploy.js verify
